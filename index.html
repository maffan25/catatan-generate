/* ============================ HAVEN core ============================ */
/* Utilitas, penyimpanan lokal, skema modul, keuangan, CSV. Tanpa DOM. */

const $ = (s, r = document) => r.querySelector(s);

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (globalThis.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
const pad = (n) => String(n).padStart(2, "0");
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const idr = (n) => { n = Math.trunc(Number.isFinite(n) ? n : 0); return (n < 0 ? "-" : "") + "Rp" + fmtNum(Math.abs(n)); };
const idrC = (n) => {
  const a = Math.abs(n), s = n < 0 ? "-" : "";
  if (a >= 1e9) return s + "Rp" + (a / 1e9).toFixed(1) + "M";
  if (a >= 1e6) return s + "Rp" + (a / 1e6).toFixed(1) + "jt";
  if (a >= 1e3) return s + "Rp" + Math.round(a / 1e3) + "rb";
  return s + "Rp" + a;
};
const fmtNum = (n) => new Intl.NumberFormat("id-ID").format(n);
const parseMoney = (s) => { const d = String(s).replace(/[^\d]/g, ""); if (!d) return null; const n = Number(d); return Number.isSafeInteger(n) ? n : null; };

const amt = (t) => (Number.isSafeInteger(t.amount) ? t.amount : 0);
function accountBalance(acc) {
  let b = Number.isSafeInteger(acc.openingBalance) ? acc.openingBalance : 0;
  for (const t of Store.list("transactions")) {
    if (t.archived) continue;
    if (t.type === "income" && t.accountId === acc.id) b += amt(t);
    else if (t.type === "expense" && t.accountId === acc.id) b -= amt(t);
    else if (t.type === "transfer") { if (t.accountId === acc.id) b -= amt(t); if (t.toAccountId === acc.id) b += amt(t); }
  }

    if (t.type === "income") income += amt(t); else if (t.type === "expense") expense += amt(t);

}

const validDate = (s) => { if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false; const d = new Date(s + "T00:00:00Z"); return !isNaN(d) && d.toISOString().slice(0, 10) === s; };

    const m = parseRupiah(r.amount || ""); if (m.err) pr.push(m.err);
    const acc = fa(r.account); if (!acc) pr.push(`Akun "${r.account}" tidak ditemukan`);

function pageAnalytics(host) {
  const today = TODAY(), month = today.slice(0, 7), tasks = Store.list("tasks").filter((t) => !t.archived), txs = Store.list("transactions"), habits = Store.list("habits").filter((h) => !h.archived), logs = Store.list("habitLogs");
  host.innerHTML = pageHead("Analitik", "Semua grafik dihitung langsung dari data yang tersimpan.");
  if (!tasks.length && !txs.length && !habits.length) { host.innerHTML += empty("Belum ada data untuk dianalisis", "Tambahkan tugas, transaksi, atau kebiasaan — grafik akan muncul otomatis."); return; }
  const byStatus = TASK_STATUS.map((s) => tasks.filter((t) => t.status === s.value).length);
  const ws = startOfWeek(today, S().weekStart), wl = [], wv = [];
  for (let i = 7; i >= 0; i--) { const st = addDays(ws, -7 * i), en = addDays(st, 6); wl.push(st.slice(5)); wv.push(tasks.filter((t) => t.completedAt && t.completedAt >= st && t.completedAt <= en).length); }

  const fl = [], fv = []; for (let i = 5; i >= 0; i--) { const m = addMonths(month, -i); fl.push(m.slice(5) + "/" + m.slice(2, 4)); fv.push(monthTotals(m).net); }
  const hb = habits.map((h) => ({ name: h.name, v: Array.from({ length: 28 }, (_, i) => addDays(today, -i)).filter((d) => logs.some((l) => l.habitId === h.id && l.date === d)).length }));
  const card = (t, b, cls = "") => `<div class="card p5 ${cls}"><h2 class="sec" style="margin-bottom:12px">${esc(t)}</h2>${b}</div>`;
  host.innerHTML += `<div class="grid g2">${card("Tugas per status", barsHTML(TASK_STATUS.map((s) => s.label), [{ name: "Tugas", color: "rgb(var(--sage))", values: byStatus }]))}${card("Tugas selesai per minggu (8 minggu)", barsHTML(wl, [{ name: "Selesai", color: "rgb(var(--accent))", values: wv }]))}${card("Pengeluaran " + monthLabel(month), donutHTML(spend, idr))}${card("Arus kas bersih (6 bulan)", barsHTML(fl, [{ name: "Neto", color: "rgb(var(--sage))", values: fv }], idr))}${hb.length ? card("Konsistensi kebiasaan (hari terpenuhi dalam 28 hari)", `<div class="stack-lg">${hb.map((h) => `<div><div class="row between sm" style="margin-bottom:4px"><span>${esc(h.name)}</span><span class="xs muted">${h.v}/28</span></div>${bar((h.v / 28) * 100)}</div>`).join("")}</div>`, "col2") : ""}</div>`;

}

}
setInterval(checkReminders, 60000);

/* ------------------------------ boot ------------------------------ */
function boot() {
  Store.load(); applyTheme();
  if (!$("#root")) return;
  route(); checkReminders();
  if (Store.status && Store.status.state === "error") toast("Penyimpanan browser tidak tersedia; data tidak akan tersimpan.");
}
document.addEventListener("DOMContentLoaded", boot);
</script></body></html>
